name: Build Desktop Releases

# Runs on every push to master (build-only, catches breakage early) and on version
# tags (build + attach all artifacts to a GitHub Release). Can also be triggered by
# hand from the Actions tab for a one-off test build.
on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # The budget guard's own tests, on every run. Most of what they assert is the
  # wiring — that every upload in this repository is measured first and expires
  # inside a week — so an invariant nobody exercises would just be a comment.
  artifact-budget:
    name: Artifact budget guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test the guard
        # PyYAML reads the workflow files for the wiring check; the runner image
        # normally has it, and installing it is cheaper than skipping the check.
        run: |
          python3 -c 'import yaml' || pip3 install --quiet pyyaml
          bash scripts/artifact-budget.test.sh

  test:
    # Windows: the rendering and printing tests load SkiaSharp's native library, and
    # the test projects only reference the Windows native assets.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # --blame-hang-timeout turns a hung test into a fast failure instead of a
      # six-hour runner timeout.
      - name: Test
        # Test projects only: the solution also contains the Blazor WebAssembly app, which
        # needs the wasm-tools workload and has no tests of its own.
        shell: bash
        run: |
          for project in tests/*/*.csproj; do
            dotnet test "$project" --configuration Release --blame-hang-timeout 2m
          done

  determine-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      msi_version: ${{ steps.version.outputs.msi_version }}
      is_release: ${{ steps.version.outputs.is_release }}
    steps:
      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
            is_release=true
          else
            version="0.0.0-dev.${GITHUB_RUN_NUMBER}"
            is_release=false
          fi
          # MSI ProductVersion must be a plain N.N.N.N (no pre-release suffix).
          msi_version="$(echo "$version" | cut -d'-' -f1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "msi_version=$msi_version" >> "$GITHUB_OUTPUT"
          echo "is_release=$is_release" >> "$GITHUB_OUTPUT"

  build:
    # `artifact-budget` gates the build so that a guard whose wiring broke stops
    # the installers being stored at all: the tests are the only thing checking
    # that this job still measures before it uploads.
    needs: [artifact-budget, test, determine-version]
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            kind: windows
            arch: x64
          - rid: win-x86
            os: windows-latest
            kind: windows
            arch: x86
          - rid: linux-x64
            os: ubuntu-latest
            kind: linux
          - rid: osx-x64
            os: macos-latest
            kind: macos
          - rid: osx-arm64
            os: macos-latest
            kind: macos
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.determine-version.outputs.version }}
      MSI_VERSION: ${{ needs.determine-version.outputs.msi_version }}
      APP_NAME: IBEBarcodeGenerator
    steps:
      - uses: actions/checkout@v4

      # The macOS images carry several Xcode copies (~15+ GB each) that a pure .NET build
      # never uses; without this the osx-x64 packaging step dies in hdiutil with
      # "No space left on device".
      - name: Free disk space (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          df -h / | tail -1
          sudo rm -rf /Applications/Xcode*.app
          sudo rm -rf /Users/runner/Library/Android/sdk
          df -h / | tail -1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Publish self-contained single-file executable
        shell: bash
        run: |
          dotnet publish src/IBEBarcode.Desktop \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:Version=${{ env.MSI_VERSION }} \
            -o publish/${{ matrix.rid }}

      - name: Strip debug symbols from the portable payload
        shell: bash
        run: find publish/${{ matrix.rid }} -name '*.pdb' -delete

      # ---------------- Portable packages ----------------

      - name: Package portable (Windows)
        if: matrix.kind == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "publish/${{ matrix.rid }}/*" -DestinationPath "$env:APP_NAME-$env:VERSION-${{ matrix.rid }}-portable.zip"

      - name: Package portable (Linux/macOS)
        if: matrix.kind != 'windows'
        shell: bash
        run: |
          chmod +x "publish/${{ matrix.rid }}/IBEBarcode.Desktop"
          tar -czf "${APP_NAME}-${VERSION}-${{ matrix.rid }}-portable.tar.gz" -C "publish/${{ matrix.rid }}" .

      # ---------------- Windows MSI installer ----------------

      - name: Install WiX (pre-OSMF release)
        if: matrix.kind == 'windows'
        shell: bash
        run: dotnet tool install --global wix --version 5.0.2

      - name: Build MSI installer
        if: matrix.kind == 'windows'
        shell: bash
        run: |
          wix build installer/windows/product.wxs \
            -d "PublishDir=$(cygpath -w "$PWD/publish/${{ matrix.rid }}")" \
            -d "ProductVersion=${MSI_VERSION}" \
            -arch ${{ matrix.arch }} \
            -out "${APP_NAME}-${VERSION}-${{ matrix.rid }}.msi"

      # ---------------- macOS .app + .dmg ----------------

      - name: Build .app bundle and .dmg installer
        if: matrix.kind == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          APP_BUNDLE="${APP_NAME}.app"
          mkdir -p "$APP_BUNDLE/Contents/MacOS" "$APP_BUNDLE/Contents/Resources"
          cp -R "publish/${{ matrix.rid }}/." "$APP_BUNDLE/Contents/MacOS/"
          chmod +x "$APP_BUNDLE/Contents/MacOS/IBEBarcode.Desktop"

          # Best-effort .icns from the company logo; a distorted/missing icon is not
          # fatal, so failures here don't stop the build.
          if command -v sips >/dev/null && command -v iconutil >/dev/null; then
            iconset="AppIcon.iconset"
            mkdir -p "$iconset"
            for size in 16 32 128 256 512; do
              sips -z $size $size src/IBEBarcode.Desktop/Assets/ibe-logo.jpg --out "$iconset/icon_${size}x${size}.png" >/dev/null || true
              double=$((size * 2))
              sips -z $double $double src/IBEBarcode.Desktop/Assets/ibe-logo.jpg --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null || true
            done
            iconutil -c icns "$iconset" -o "$APP_BUNDLE/Contents/Resources/AppIcon.icns" || true
          fi

          sed "s/__VERSION__/${MSI_VERSION}/" installer/macos/Info.plist.template > "$APP_BUNDLE/Contents/Info.plist"

          hdiutil create -volname "IBE Barcode Generator" -srcfolder "$APP_BUNDLE" -ov -format UDZO \
            "${APP_NAME}-${VERSION}-${{ matrix.rid }}.dmg"

      # ---------------- Linux .deb ----------------

      - name: Build .deb package
        if: matrix.kind == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          PKGROOT="pkgroot"
          rm -rf "$PKGROOT"
          mkdir -p "$PKGROOT/DEBIAN" "$PKGROOT/opt/ibe-barcode-generator" "$PKGROOT/usr/share/applications" "$PKGROOT/usr/local/bin"
          cp -R "publish/${{ matrix.rid }}/." "$PKGROOT/opt/ibe-barcode-generator/"
          chmod +x "$PKGROOT/opt/ibe-barcode-generator/IBEBarcode.Desktop"
          ln -s /opt/ibe-barcode-generator/IBEBarcode.Desktop "$PKGROOT/usr/local/bin/ibe-barcode-generator"

          sed "s/__VERSION__/${MSI_VERSION}/" installer/linux/control.template > "$PKGROOT/DEBIAN/control"
          cp installer/linux/ibe-barcode-generator.desktop "$PKGROOT/usr/share/applications/ibe-barcode-generator.desktop"

          dpkg-deb --build --root-owner-group "$PKGROOT" "${APP_NAME}-${VERSION}-${{ matrix.rid }}.deb"

      # ---------------- Artifact budget ----------------

      # These installers are the most expensive thing on the account's artifact
      # meter: 436.8 MB for this run across the five RIDs, 87% of a month's
      # 500 MB allowance, held seven days. That is what spent the October
      # allowance — three runs in two days put 1.31 GB in flight and the month
      # was gone before anything expired, which then refused uploads in a sibling
      # repository holding no artifacts at all. `scripts/artifact-budget.mjs`
      # carries the arithmetic; this step measures the files it is about to store
      # and refuses before the meter is spent rather than after.
      #
      # The budget is per RID because one job can only see its own files, and it
      # is derived from the run:
      #   - push build — the run gets a fifth of the month in total, so 20 MiB
      #     each. That is less than any RID costs, so a push build stores no
      #     installers; the build itself is the signal and the log is the record.
      #   - tag build — the release, whose installers ARE the product. Each RID
      #     gets the whole fifth (100 MiB, ~437 MB for the run = 20% of the
      #     allowance in GB-hr at 7 days), printed on every release.
      #
      # Only an over-budget verdict is downgraded to a warning. A usage error
      # (exit 2) still fails the job: a guard that cannot measure must not read
      # as "inside the budget".
      - name: Check the artifact budget
        id: budget
        shell: bash
        env:
          IS_RELEASE: ${{ needs.determine-version.outputs.is_release }}
        run: |
          set -euo pipefail
          if [ "$IS_RELEASE" = "true" ]; then budget=100; else budget=20; fi
          status=0
          node scripts/artifact-budget.mjs \
            --label "$APP_NAME ${{ matrix.rid }}" \
            --budget-mb "$budget" \
            --retention-days 7 \
            "$APP_NAME-*.zip" \
            "$APP_NAME-*.tar.gz" \
            "$APP_NAME-*.msi" \
            "$APP_NAME-*.dmg" \
            "$APP_NAME-*.deb" || status=$?
          if [ "$status" -eq 1 ]; then
            echo "::warning title=Artifact budget::${{ matrix.rid }} was not stored: it is over this run's ${budget} MiB share of the account's artifact allowance. The step above says by how much."
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi

      # ---------------- Upload ----------------

      # `retention-days` is stated rather than inherited: seven is both what the
      # budget above projects its cost with and the shortest the run page needs
      # to be useful, and every day held is a day of the allowance the next run
      # needs.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        # Skipped when the budget says no: storing these files is what spends the
        # meter, and the warning above is the record of it.
        if: steps.budget.outputs.over-budget != 'true'
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.rid }}
          retention-days: 7
          path: |
            ${{ env.APP_NAME }}-*.zip
            ${{ env.APP_NAME }}-*.tar.gz
            ${{ env.APP_NAME }}-*.msi
            ${{ env.APP_NAME }}-*.dmg
            ${{ env.APP_NAME }}-*.deb
          if-no-files-found: error

  release:
    needs: [determine-version, build]
    if: needs.determine-version.outputs.is_release == 'true'
    runs-on: ubuntu-latest
    # Creating the release and uploading assets needs contents: write; without this the
    # default GITHUB_TOKEN is read-only and the job fails with 403 "Resource not accessible
    # by integration".
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
